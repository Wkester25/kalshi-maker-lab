<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Kalshi Maker Lab</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d38;--text:#dfe5ec;--dim:#8a95a3;--bad:#e5604d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 26px 22px;width:min(360px,92vw);display:grid;gap:14px}
h1{font-size:17px;margin:0 0 4px;font-weight:650}
label{display:grid;gap:5px;font-size:12.5px;color:var(--dim)}
input{background:#0e1116;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit}
input:focus{outline:2px solid #2b5687;border-color:#2b5687}
button{background:#1d3a5c;color:var(--text);border:1px solid #2b5687;border-radius:6px;padding:9px 12px;font:inherit;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:default}
#err{color:var(--bad);font-size:13px;min-height:19px;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Kalshi Maker Lab</h1>
  <label>Username<input name="username" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <p id="err" role="alert"></p>
  <button id="go">Sign in</button>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: f.username.value, password: f.password.value})});
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json()).error || 'Could not sign in';
  } catch (x) { err.textContent = 'Could not reach the program'; }
  go.disabled = false; f.password.value = ''; f.password.focus();
};
</script>
</body>
</html>
